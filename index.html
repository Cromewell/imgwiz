<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>imgwiz — local image editing suite</title>
    <meta
      name="description"
      content="Black & white conversion, exposure, dithering, crop, resize and format conversion. Everything runs in your browser; no image is ever uploaded."
    />
    <!-- The production CSP is injected at build time; see vite.config.ts. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light" />
    <!-- Inlined as a data URI so the page makes zero network requests. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1116'/%3E%3Cg fill='%234da3ff'%3E%3Crect x='5' y='5' width='6' height='6'/%3E%3Crect x='17' y='5' width='6' height='6'/%3E%3Crect x='11' y='11' width='6' height='6'/%3E%3Crect x='23' y='11' width='6' height='6'/%3E%3Crect x='5' y='17' width='6' height='6'/%3E%3Crect x='17' y='17' width='6' height='6'/%3E%3Crect x='11' y='23' width='6' height='6'/%3E%3Crect x='23' y='23' width='6' height='6'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        imgwiz does all of its work in your browser, so it needs JavaScript enabled. Nothing is sent anywhere either way.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
